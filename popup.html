<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoopTV</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body><main>
  <header><img src="./assets/looptv-logo.webp" alt="LoopTV" width="104" height="104"><span>v0.7 · KLIPY</span></header>
  <p>Sur Twitch, clique sur GIF pour rechercher une animation KLIPY dans le chat. Choisis-la, puis envoie avec Entrée.</p>
  <label class="toggle"><input type="checkbox" id="enabled" checked> Activer les GIFs</label>
  <label class="toggle"><input type="checkbox" id="allow-motion"> Animer même si Windows réduit les animations</label>
  <p class="note">Pas de compte ni clé à saisir pour les spectateurs. KLIPY héberge les GIFs et traite les recherches et requêtes médias.</p>
  <footer>Powered by KLIPY · extension indépendante</footer>
</main><script src="./popup.js"></script></body>
</html>
