<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GIFRIFT</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body><main>
  <header><strong>GIFRIFT</strong><span>v0.6 · GIFs</span></header>
  <p>Cliquer sur GIF dans Twitch ouvre une petite fenêtre de recherche GIPHY. Choisis un GIF, puis envoie-le avec Entrée.</p>
  <label class="toggle"><input type="checkbox" id="enabled" checked> Activer les GIFs</label>
  <label class="toggle"><input type="checkbox" id="allow-motion"> Animer même si Windows réduit les animations</label>
  <p class="note">Sans compte ni clé API. Si la fenêtre de recherche est bloquée, la saisie manuelle d'un lien GIPHY reste disponible.</p>
  <footer>GIFRIFT · prototype gratuit</footer>
</main><script src="./popup.js"></script></body>
</html>
